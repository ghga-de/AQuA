version: "1.0"
note: "Trimmed concepts to only include targeted GHGA QC metrics"
concepts:
  # FASTP & FASTPLONG
  fastp.total_reads:
    sources:
      - anchor: general_stats_table
        metric: filtering_result_passed_filter_reads
        section_key: fastp
        tool: fastp
    title: "Total Reads"
  fastp.q20_rate: 
    sources:
      - anchor: general_stats_table
        metric: after_filtering_q20_rate 
        section_key: fastp
        tool: fastp
    title: "Q20 Rate"
  fastp.gc_content:
    sources:
      - anchor: general_stats_table
        metric: after_filtering_gc_content
        section_key: fastp
        tool: fastp
    title: "GC Content"

  # MOSDEPTH
  mosdepth.mean_coverage:
    sources:
      - anchor: general_stats_table
        metric: mean_coverage
        section_key: mosdepth
        tool: mosdepth_coverage
    title: "Mean Coverage"

  # SAMBAMBA / SAMTOOLS FLAGSTAT
  flagstat.reads_mapped:
    sources:
      - anchor: samtools-flagstat-table
        metric: mapped_passed
        section_key: samtools-flagstat-table_table
        tool: samtools
    title: "Reads Mapped"
  flagstat.reads_duplicated:
    sources:
      - anchor: samtools-flagstat-table
        metric: duplicates_passed
        section_key: samtools-flagstat-table_table
        tool: samtools
    title: "Reads Duplicated"

  # BCFTOOLS
  bcftools.number_of_records:
    sources:
      - anchor: general_stats_table
        metric: number_of_records
        section_key: bcftools
        tool: bcftools_stats
    title: "Number of Records"
  bcftools.number_of_samples:
    sources:
      - anchor: general_stats_table
        metric: number_of_samples
        section_key: bcftools
        tool: bcftools_stats
    title: "Number of Samples"